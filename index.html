<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Digital World Clock</h1>
        <p>Live time across multiple cities</p>
      </header>

      <section class="panel" aria-labelledby="controls-heading">
        <h2 id="controls-heading">Clock controls</h2>
        <div class="controls-grid">
          <label for="timezone-select">Add time zone</label>
          <select id="timezone-select" aria-label="Select a time zone to add"></select>
          <button id="add-clock" type="button">Add clock</button>

          <fieldset class="settings" aria-label="Display settings">
            <legend>Display settings</legend>
            <label>
              <input id="setting-24h" type="checkbox" />
              Use 24-hour format
            </label>
            <label>
              <input id="setting-seconds" type="checkbox" checked />
              Show seconds
            </label>
          </fieldset>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section>
        <h2 class="visually-hidden">Clock list</h2>
        <ul id="clock-list" class="clock-grid" aria-label="World clocks"></ul>
      </section>
    </main>

    <script type="module" src="/app.mjs"></script>
  </body>
</html>
